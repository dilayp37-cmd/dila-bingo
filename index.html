
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dila Bingo</title>
    <style>
        :root {
            --bg-color: #d1c4e9;
            --header-bg: #4a148c;
            --card-bg: #ffffff;
            --b-color: #ffb300;
            --i-color: #00e676;
            --n-color: #29b6f6;
            --g-color: #ef5350;
            --o-color: #ab47bc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Top Info Bar */
        .top-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #fff;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            font-weight: bold;
        }

        .stat-val {
            font-size: 12px;
            font-weight: 800;
            color: #333;
        }

        /* Main Game Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
        }

        /* Left Board (1-75 Numbers) */
        .board-container {
            background: #fff;
            border-radius: 12px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            max-height: 520px;
            overflow-y: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .board-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            color: #fff;
            margin-bottom: 4px;
        }

        .b-head { background: var(--b-color); }
        .i-head { background: var(--i-color); }
        .n-head { background: var(--n-color); }
        .g-head { background: var(--g-color); }
        .o-head { background: var(--o-color); }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }

        .board-num {
            background: #f5f5f5;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            padding: 4px 0;
            border-radius: 3px;
            color: #333;
        }

        .board-num.active {
            background: #ff4081;
            color: #fff;
        }

        /* Right Side: Status + Cartela */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Shuffling Banner */
        .shuffling-card {
            background: var(--header-bg);
            color: #fff;
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shuffling-title {
            font-size: 18px;
            font-weight: bold;
        }

        .timer-badge {
            background: #ff6f00;
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* Control Toggles */
        .toggles-bar {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            font-size: 12px;
            font-weight: bold;
            color: #4a148c;
        }

        /* Cartela Section */
        .cartela-card {
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .cartela-title {
            color: #2e7d32;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .c-cell {
            background: #f5f5f5;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            color: #333;
        }

        .c-cell.marked {
            background: #00e676;
            color: #fff;
        }

        .c-cell.free {
            background: #00e676;
            color: #fff;
            font-size: 16px;
        }

        /* Bottom Buttons */
        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .btn-refresh { background: #29b6f6; }
        .btn-auto { background: #00e676; }
    </style>
</head>
<body>

    <!-- Top Stats -->
    <div class="top-stats">
        <div class="stat-box"><span class="stat-label">Game ID</span><span class="stat-val">MBGWQ4FF</span></div>
        <div class="stat-box"><span class="stat-label">Derash</span><span class="stat-val">10</span></div>
        <div class="stat-box"><span class="stat-label">Players</span><span class="stat-val">1</span></div>
        <div class="stat-box"><span class="stat-label">Bet</span><span class="stat-val">10</span></div>
        <div class="stat-box"><span class="stat-label">Call</span><span class="stat-val" id="call-count">0</span></div>
    </div>

    <!-- Main Section -->
    <div class="main-layout">
        <!-- Left Column: 1-75 Numbers -->
        <div class="board-container">
            <div class="board-header">
                <div class="b-head">B</div>
                <div class="i-head">I</div>
                <div class="n-head">N</div>
                <div class="g-head">G</div>
                <div class="o-head">O</div>
            </div>
            <div class="board-grid" id="full-board"></div>
        </div>

        <!-- Right Column: Status + Cartela -->
        <div class="right-panel">
            <div class="shuffling-card">
                <span class="shuffling-title" id="status-title">Shuffling</span>
                <div class="timer-badge" id="timer">40</div>
            </div>

            <div class="toggles-bar">
                <span>🔊 Sound</span>
                <span>Auto ON</span>
            </div>

            <!-- Cartela -->
            <div class="cartela-card">
                <div class="cartela-title">Cartela #40</div>
                <div class="board-header" style="margin-bottom: 6px;">
                    <div class="b-head">B</div>
                    <div class="i-head">I</div>
                    <div class="n-head">N</div>
                    <div class="g-head">G</div>
                    <div class="o-head">O</div>
                </div>
                <div class="cartela-grid" id="cartela-board"></div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-btns">
        <button class="btn btn-refresh" onclick="generateCartela()">Refresh</button>
        <button class="btn btn-auto" onclick="toggleAutoGame()">Automatic</button>
    </div>

    <script>
        let calledNumbers = [];
        let timerSeconds = 40;
        let intervalId = null;
        let isRunning = false;

        // Render Left 1-75 Board Grid
        function initFullBoard() {
            const board = document.getElementById('full-board');
            board.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 5; c++) {
                    let num = (c * 15) + (r + 1);
                    let div = document.createElement('div');
                    div.className = 'board-num';
                    div.id = `b-num-${num}`;
                    div.innerText = num;
                    board.appendChild(div);
                }
            }
        }

        // Generate Cartela
        function generateCartela() {
            const grid = document.getElementById('cartela-board');
            grid.innerHTML = '';
            let columns = [
                getRandNums(1, 15, 5),
                getRandNums(16, 30, 5),
                getRandNums(31, 45, 5),
                getRandNums(46, 60, 5),
                getRandNums(61, 75, 5)
            ];

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'c-cell';
                    if (r === 2 && c === 2) {
                        cell.innerText = '★';
                        cell.classList.add('free');
                    } else {
                        let val = columns[c][r];
                        cell.innerText = val;
                        cell.dataset.val = val;
                        cell.onclick = () => cell.classList.toggle('marked');
                    }
                    grid.appendChild(cell);
                }
            }
        }

        function getRandNums(min, max, count) {
            let arr = [];
            while(arr.length < count){
                let r = Math.floor(Math.random() * (max - min + 1)) + min;
                if(!arr.includes(r)) arr.push(r);
            }
            return arr;
        }

        // Auto Game Countdown (40s Cycle)
        function toggleAutoGame() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('status-title').innerText = "Playing...";
            
            intervalId = setInterval(() => {
                timerSeconds--;
                document.getElementById('timer').innerText = timerSeconds;

                if (timerSeconds <= 0) {
                    drawNextNumber();
                    timerSeconds = 40; // በየ 40 ሰከንዱ አዲስ ቁጥር ይወጣል
                }
            }, 1000);
        }

        function drawNextNumber() {
            if (calledNumbers.length >= 75) {
                alert("Game Finished!");
                clearInterval(intervalId);
                return;
            }
            let n;
            do {
                n = Math.floor(Math.random() * 75) + 1;
            } while (calledNumbers.includes(n));

            calledNumbers.push(n);
            document.getElementById('call-count').innerText = calledNumbers.length;

            // Highlight in left board
            let boardEl = document.getElementById(`b-num-${n}`);
            if (boardEl) boardEl.classList.add('active');

            // Highlight on player cartela if present
            document.querySelectorAll('.c-cell').forEach(cell => {
                if (cell.dataset.val == n) {
                    cell.classList.add('marked');
                }
            });

            // Voice Speech
            let speech = new SpeechSynthesisUtterance(n.toString());
            window.speechSynthesis.speak(speech);
        }

        initFullBoard();
        generateCartela();
    </script>
</body>
</html>
