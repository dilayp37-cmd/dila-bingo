<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dila Bingo Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        h1 {
            color: #ffcc00;
            font-size: 24px;
        }
        .board-btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            padding: 15px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }
        .board-btn.selected {
            background-color: #4CAF50;
            border-color: #fff;
        }
        #boardsGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-width: 400px;
            margin: 0 auto;
        }
        #countdown-text {
            font-size: 18px;
            color: #ff9800;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div id="selection-screen">
        <h1>ዲላ ቢንጎ (Dila Bingo)</h1>
        <p id="countdown-text">ሰዓት በመጠበቅ ላይ...</p>
        <p id="boardsCountText">Boards: 0/2</p>
        <div id="boardsGrid"></div>
    </div>

    <script>
        // የተጠቃሚ መለያ (Device Session ID)
        function getDeviceSessionId() {
            let sessionId = localStorage.getItem('dila_device_session');
            if (!sessionId) {
                sessionId = 'user_' + Math.random().toString(36).substring(2, 9);
                localStorage.setItem('dila_device_session', sessionId);
            }
            return sessionId;
        }

        let selectedBoards = [];
        let allCartelas = {};

        function generateCartelaNumbers(seed) {
            let numbers = [];
            for(let i = 1; i <= 75; i++) numbers.push(i);
            // በ Seed ላይ ተመስርቶ ቁጥሮችን ማቀላቀል
            return numbers.sort(() => 0.5 - Math.random());
        }

        function getTotalActivePlayersCount() {
            // በLocalStorage ያሉትን ንቁ ተጫዋቾች ብዛት ማግኘት
            let count = 0;
            for(let i=0; i<localStorage.length; i++) {
                let key = localStorage.key(i);
                if(key && key.startsWith('dila_my_boards_')) {
                    let val = JSON.parse(localStorage.getItem(key));
                    if(val && val.length > 0) count++;
                }
            }
            return count > 0 ? count : 1;
        }

        function triggerGlobalGameStart() {
            let activeGame = { started: true, startTime: Date.now() };
            localStorage.setItem('dila_active_game', JSON.stringify(activeGame));
        }

        function startAutomaticGame(gameSession) {
            alert("ጨዋታው ተጀምሯል! አውቶማቲክ ሁነታ ገብቷል።");
            // እዚህጋ ወደ ጨዋታው መጫወቻ ስክሪን የሚወስደው ኮድዎ ይቀጥላል
        }

        const grid = document.getElementById('boardsGrid');
        const countText = document.getElementById('boardsCountText');

        // ተጠቃሚው ሲገባ በራሱ (አውቶማቲክ) 2 ካርቴላዎች እንዲመረጡ ማድረግ (ለምሳሌ ቦርድ ቁጥር 1 እና 2)
        let savedAutoBoards = JSON.parse(localStorage.getItem('dila_my_boards_' + getDeviceSessionId()));
        if (!savedAutoBoards || savedAutoBoards.length === 0) {
            selectedBoards = [1, 2]; 
            localStorage.setItem('dila_my_boards_' + getDeviceSessionId(), JSON.stringify(selectedBoards));
        } else {
            selectedBoards = savedAutoBoards;
        }

        for (let i = 1; i <= 90; i++) {
            allCartelas[i] = generateCartelaNumbers(i);
            const btn = document.createElement('button');
            btn.className = 'board-btn';
            btn.innerText = i;
            
            if (selectedBoards.includes(i)) {
                btn.classList.add('selected');
            }
            
            btn.onclick = () => {
                let activeGameSession = JSON.parse(localStorage.getItem('dila_active_game'));
                if (activeGameSession && activeGameSession.started) {
                    alert("ጨዋታው ተጀምሯል! እባክዎ ቀጣዩን ዙር ይጠብቁ።");
                    return;
                }
                if (selectedBoards.includes(i)) {
                    selectedBoards = selectedBoards.filter(item => item !== i);
                    btn.classList.remove('selected');
                } else {
                    if (selectedBoards.length >= 2) {
                        alert("ቢበዛ መያዝ የሚችሉት 2 ካርቴላ ብቻ ነው!");
                        return;
                    }
                    selectedBoards.push(i);
                    btn.classList.add('selected');
                }
                countText.innerText = `Boards: ${selectedBoards.length}/2`;
                
                localStorage.setItem('dila_my_boards_' + getDeviceSessionId(), JSON.stringify(selectedBoards));
            };
            grid.appendChild(btn);
        }
        countText.innerText = `Boards: ${selectedBoards.length}/2`;

        // የሰዓት ቆጣሪ እና የሰዎች ማመሳሰል (Timer Sync)
        const countdownTextEl = document.getElementById("countdown-text");
        
        setInterval(() => {
            let now = Date.now();
            let gameSession = JSON.parse(localStorage.getItem('dila_active_game')) || { started: false };

            if (gameSession.started) {
                if (document.getElementById('selection-screen').style.display !== 'none') {
                    if (selectedBoards.length > 0) {
                        startAutomaticGame(gameSession);
                    } else {
                        countdownTextEl.innerText = `ጨዋታው በሂደት ላይ ነው... እባክዎ ቀጣዩን ዙር ይጠបቁ።`;
                    }
                }
                return;
            }

            let totalPlayers = getTotalActivePlayersCount();
            let sharedTimer = localStorage.getItem('dila_shared_timer');
            let targetTime;
            
            if (!sharedTimer || now > parseInt(sharedTimer)) {
                targetTime = now + 20000; // 20 ሰከንድ
                localStorage.setItem('dila_shared_timer', targetTime);
            } else {
                targetTime = parseInt(sharedTimer);
            }

            let timeLeft = Math.max(0, Math.floor((targetTime - now) / 1000));
            
            if (selectedBoards.length === 0) {
                countdownTextEl.innerText = `ጨዋታው በ ${timeLeft} ሰከንድ ውስጥ ይጀምራል! (ካርቴላ ይምረጡ)`;
            } else {
                countdownTextEl.innerText = `ጨዋታው በ ${timeLeft} ሰከንድ ውስጥ ይጀምራል... (ተጫዋቾች: ${totalPlayers})`;
            }

            if (timeLeft <= 0 && !gameSession.started) {
                let activeTotal = getTotalActivePlayersCount();
                if (activeTotal > 0) {
                    triggerGlobalGameStart();
                } else {
                    localStorage.setItem('dila_shared_timer', Date.now() + 15000);
                }
            }
        }, 1000);
    </script>
</body>
</html>
