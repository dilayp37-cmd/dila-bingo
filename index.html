
            <div id="timer-box" style="text-align: center; font-size: 20px; font-weight: bold; color: #e74c3c; margin: 10px 0;">
    ጨዋታው በ <span id="countdown">40</span> ሰከንድ ይጀምራል...
</div>
       <script>
    let timeLeft = 40;
    const timerElement = document.getElementById('countdown');

    const timerInterval = setInterval(() => {
        timeLeft--;
        if (timerElement) {
            timerElement.innerText = timeLeft;
        }

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            // ሰዓቱ 0 ሲደርስ በራሱ የጨዋታውን ቁልፍ ይጫናል
            const playBtn = document.querySelector('.play-btn') || document.querySelector('button'); 
            if (playBtn) {
                playBtn.click();
            }
        }
    }, 1000);
</script>
