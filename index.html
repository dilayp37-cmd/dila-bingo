<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dila Bingo</title>
    <style>
        body {
            background-color: #2b0c1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 8px;
            padding-bottom: 60px;
        }
        .top-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: #4a1535;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: center;
        }
        .stat-box {
            background: #ffffff;
            color: #2b0c1e;
            padding: 4px 2px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .stat-box span {
            display: block;
            font-size: 9px;
            color: #555;
        }
        .game-layout {
            display: flex;
            gap: 8px;
        }
        /* የግራ በኩል የቁጥሮች ሰንጠረዥ (1-75) */
        .caller-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            background: #ffffff;
            padding: 6px;
            border-radius: 8px;
        }
        .call-cell {
            background: #f1f2f6;
            color: #2f3640;
            text-align: center;
            padding: 6px 0;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
        }
        .call-cell.active {
            background: #ff9f43;
            color: #fff;
        }
        /* የቀኝ በኩል የካርቴላ እና የጥሪ ማሳያ */
        .right-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .current-call-card {
            background: #4a1535;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .current-number {
            font-size: 22px;
            color: #ffd700;
            font-weight: bold;
            background: #2b0c1e;
            display: inline-block;
            padding: 4px 15px;
            border-radius: 20px;
            margin-top: 4px;
        }
        .cartela-container {
            background: #ffffff;
            color: #2b0c1e;
            padding: 8px;
            border-radius: 8px;
        }
        .cartela-title {
            font-size: 13px;
            font-weight: bold;
            color: #2b0c1e;
            margin-bottom: 6px;
        }
        .bingo-table {
            width: 100%;
            border-collapse: collapse;
        }
        .bingo-table th {
            background: #3498db;
            color: white;
            font-size: 11px;
            padding: 3px;
        }
        .bingo-table td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 6px 0;
            font-size: 12px;
            font-weight: bold;
            background: #f8f9fa;
        }
        .bingo-table td.marked {
            background: #2ecc71;
            color: white;
        }
        .bingo-table td.star {
            background: #2ecc71;
            color: white;
            font-size: 14px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #350924;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 2px solid #57133a;
        }
        .nav-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- የላይኛውን መረጃዎች ሰንጠረዥ -->
    <div class="top-stats">
        <div class="stat-box"><span>Game ID</span>MB9G</div>
        <div class="stat-box"><span>Derash</span>20</div>
        <div class="stat-box"><span>Players</span>2</div>
        <div class="stat-box"><span>Bet</span>10</div>
        <div class="stat-box" id="call-count"><span>Call</span>0</div>
    </div>

    <div class="game-layout">
        <!-- የግራ በኩል የቁጥሮች ሰሌዳ (1 እስከ 75) -->
        <div class="caller-grid" id="callerGrid"></div>

        <!-- የቀኝ በኩል ማሳያ -->
        <div class="right-section">
            <div class="current-call-card">
                <div style="font-size: 12px; color: #ddd;">Current Call</div>
                <div class="current-number" id="currentNumDisp">--</div>
            </div>

            <!-- የካርቴላ ማሳያ -->
            <div class="cartela-container">
                <div class="cartela-title">Cartela #62</div>
                <table class="bingo-table">
                    <tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>
                    <tr><td>6</td><td>16</td><td>38</td><td>51</td><td>69</td></tr>
                    <tr><td>4</td><td>30</td><td>43</td><td class="marked">52</td><td>68</td></tr>
                    <tr><td>3</td><td>29</td><td class="star">★</td><td>56</td><td>75</td></tr>
                    <tr><td>11</td><td>20</td><td>42</td><td>47</td><td>72</td></tr>
                    <tr><td>7</td><td>18</td><td>37</td><td>46</td><td>64</td></tr>
                </table>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="location.reload()">Refresh</button>
        <button class="nav-btn" style="background: #27ae60;" id="autoBtn">Automatic</button>
    </div>

    <script>
        // የግራውን ሰሌዳ ከ 1 እስከ 75 መሙላት
        const callerGrid = document.getElementById('callerGrid');
        const cells = {};
        for (let i = 1; i <= 75; i++) {
            const cell = document.createElement('div');
            cell.className = 'call-cell';
            cell.innerText = i;
            callerGrid.appendChild(cell);
            cells[i] = cell;
        }

        // አውቶማቲክ ቁጥሮችን እየጠራ ማሳየት
        let calledNumbers = [];
        let callCountEl = document.getElementById('call-count');
        let currentNumDisp = document.getElementById('currentNumDisp');

        function startCalling() {
            let interval = setInterval(() => {
                if (calledNumbers.length >= 75) {
                    clearInterval(interval);
                    return;
                }
                let randomNum;
                do {
                    randomNum = Math.floor(Math.random() * 75) + 1;
                } while (calledNumbers.includes(randomNum));

                calledNumbers.push(randomNum);
                currentNumDisp.innerText = randomNum;
                callCountEl.innerHTML = `<span>Call</span>${calledNumbers.length}`;

                if (cells[randomNum]) {
                    cells[randomNum].classList.add('active');
                }
            }, 2000); // በየ 2 ሰከንዱ ቁጥር ይጠራል
        }

        // ጨዋታው እንደገባ በራሱ እንዲጀምር ማድረግ
        window.onload = () => {
            startCalling();
        };
    </script>

</body>
</html>
