<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዲላ ቢንጎ - Dila Bingo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00e676;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 350px;
            margin: 20px auto;
        }
        .cell {
            background-color: #1e1e1e;
            border: 2px solid #00e676;
            border-radius: 8px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .cell.marked {
            background-color: #00e676;
            color: #000;
        }
        button {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🎲 ዲላ ቢንጎ (Dila Bingo)</h1>
    <p>ቁጥሮቹን በመንካት ይመዝግቡ!</p>

    <div class="board" id="bingoBoard"></div>

    <button onclick="generateBoard()">አዲስ ካርድ ቀይር</button>

    <script>
        function generateBoard() {
            const board = document.getElementById("bingoBoard");
            board.innerHTML = "";
            let numbers = [];
            
            while(numbers.length < 25) {
                let randomNum = Math.floor(Math.random() * 75) + 1;
                if(!numbers.includes(randomNum)) {
                    numbers.push(randomNum);
                }
            }

            numbers.forEach((num, index) => {
                let cell = document.createElement("div");
                cell.className = "cell";
                if(index === 12) {
                    cell.innerText = "FREE";
                    cell.classList.add("marked");
                } else {
                    cell.innerText = num;
                    cell.onclick = function() {
                        this.classList.toggle("marked");
                    };
                }
                board.appendChild(cell);
            });
        }

        generateBoard();
    </script>
</body>
</html>
