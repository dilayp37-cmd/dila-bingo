                
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዲላ ቢንጎ (Dila Bingo)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #00ffcc; font-size: 22px; margin-bottom: 5px; }
        .mode-btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #00ffcc;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .active-mode { background-color: #00ffcc; color: #000; }
        
        /* Auto Caller Panel */
        #caller-panel {
            background: #1a1a1a;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            max-width: 350px;
        }
        .current-number {
            font-size: 48px;
            font-weight: bold;
            color: #ffcc00;
            margin: 10px 0;
        }
        .control-btn {
            background-color: #00cc66;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .reset-btn { background-color: #ff3333; }

        /* Bingo Card */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 350px;
            margin: 15px auto;
        }
        .cell {
            background-color: #1f2937;
            border: 2px solid #00cc66;
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .cell.marked { background-color: #00cc66; color: #000; }
        .cell.free { background-color: #00ffcc; color: #000; font-size: 12px; }
    </style>
</head>
<body>

    <h1>🎲 ዲላ ቢንጎ (Dila Bingo)</h1>
    
    <div>
        <button class="mode-btn active-mode" onclick="switchMode('player')">የተጫዋች ካርቴላ</button>
        <button class="mode-btn" onclick="switchMode('caller')">የቁጥር ማውጫ (Host)</button>
    </div>

    <!-- HOST / AUTO CALLER SECTION -->
    <div id="caller-panel" style="display:none;">
        <h3>የወጣው ቁጥር:</h3>
        <div class="current-number" id="called-num">--</div>
        <button class="control-btn" id="start-btn" onclick="toggleAutoCall()">የራስ-ሰር ማውጫ ጀምር</button>
        <button class="control-btn reset-btn" onclick="resetCaller()">እንደገና ጀምር</button>
    </div>

    <!-- PLAYER CARD SECTION -->
    <div id="player-panel">
        <p>ቁጥሮቹን በመነካት ይመዝገቡ!</p>
        <div class="grid" id="bingo-board"></div>
        <button class="control-btn" onclick="generateCard()">አዲስ ካርድ ቀይር</button>
    </div>

    <script>
        let calledNumbers = [];
        let autoInterval = null;

        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active-mode'));
            if(mode === 'player') {
                document.querySelectorAll('.mode-btn')[0].classList.add('active-mode');
                document.getElementById('player-panel').style.display = 'block';
                document.getElementById('caller-panel').style.display = 'none';
            } else {
                document.querySelectorAll('.mode-btn')[1].classList.add('active-mode');
                document.getElementById('player-panel').style.display = 'none';
                document.getElementById('caller-panel').style.display = 'block';
            }
        }

        // Generate Bingo Card
        function generateCard() {
            const board = document.getElementById('bingo-board');
            board.innerHTML = '';
            let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5).slice(0, 24);
            
            let count = 0;
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (i === 12) {
                    cell.innerText = 'FREE';
                    cell.classList.add('free');
                } else {
                    cell.innerText = nums[count];
                    cell.onclick = () => cell.classList.toggle('marked');
                    count++;
                }
                board.appendChild(cell);
            }
        }

        // Auto Caller Logic
        function toggleAutoCall() {
            const btn = document.getElementById('start-btn');
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                btn.innerText = "ቀጥል";
                btn.style.backgroundColor = "#00cc66";
            } else {
                btn.innerText = "አቁም (Pause)";
                btn.style.backgroundColor = "#ff9900";
                autoInterval = setInterval(drawNumber, 4000); // በየ 4 ሴኮንዱ ይወጣል
            }
        }

        function drawNumber() {
            if (calledNumbers.length >= 75) {
                alert("ሁሉም ቁጥሮች ወጥተዋል!");
                clearInterval(autoInterval);
                return;
            }
            let randomNum;
            do {
                randomNum = Math.floor(Math.random() * 75) + 1;
            } while (calledNumbers.includes(randomNum));

            calledNumbers.push(randomNum);
            document.getElementById('called-num').innerText = randomNum;
            
            // ድምፅ እንዲያነብ ማድረግ
            let speech = new SpeechSynthesisUtterance(randomNum.toString());
            window.speechSynthesis.speak(speech);
        }

        function resetCaller() {
            clearInterval(autoInterval);
            autoInterval = null;
            calledNumbers = [];
            document.getElementById('called-num').innerText = '--';
            document.getElementById('start-btn').innerText = "የራስ-ሰር ማውጫ ጀምር";
            document.getElementById('start-btn').style.backgroundColor = "#00cc66";
        }

        generateCard();
    </script>
</body>
</html>
